name: Release

# Gate for `v*` tags: the same quality bar as CI, plus a secret scan.
# The image is pushed to Docker Hub only when every job is green.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, unit & integration
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://diabetabot:diabetabot@127.0.0.1:5432/diabetabot_test
      FAIL_ON_SKIP: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diabetabot
          POSTGRES_PASSWORD: diabetabot
          POSTGRES_DB: diabetabot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diabetabot -d diabetabot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m "not integration" -q

      - name: Integration tests
        run: uv run pytest -m "integration and not requires_ollama" -q

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # Scope the scan to the commit history reachable from the released tag.
        # Unrelated branches in the repository are not part of this release.
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --redact --verbose --log-opts="$GITHUB_SHA"

  publish:
    name: Build & push image
    needs: [quality, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/diabetabot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
