[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: cross-boundary tests that touch a real database, embeddings, or external service",
]

[project]
name = "diabetabots"
version = "0.1.0"
description = "DiabetaBot — Telegram calorie & GI analysis bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "SQLAlchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "chromadb==1.5.9",
    "langchain==1.4.4",
    "langchain-openai==1.7.0",
    "pydantic-settings==2.15.0",
    "APScheduler==3.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/services/llm_service.py" = ["E501"]  # prompt templates are inherently >100 chars
"app/bot/handlers.py" = ["E501"]  # user-facing strings (Indonesian) intentionally >100 chars
"app/services/telegram_service.py" = ["E501"]  # Telegram API URLs intentionally >100 chars
"tests/test_telegram_service.py" = ["E501", "F541"]  # long mock patch strings
"tests/test_telegram_handlers.py" = ["E501", "F541"]
