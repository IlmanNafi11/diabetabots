services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Mode A: PostgreSQL provided by compose.
  # Mode B: delete this service, point DATABASE_URL at an external host, and
  # attach the app to the external network as described in the README.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diabetabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diabetabot}
      POSTGRES_DB: ${POSTGRES_DB:-diabetabot}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diabetabot} -d ${POSTGRES_DB:-diabetabot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mode A: Ollama provided by compose (self-hosted embeddings).
  # Mode B: reset these services with docker-compose.external-ollama.yml and
  # point OLLAMA_BASE_URL at an external host.
  ollama:
    image: ollama/ollama:0.40.6
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 12g
    cpus: 4.0
    pids_limit: 100

  # One-shot model pull: fetches the embedding model once and exits. The app
  # starts only after this succeeds, so the first embedding call never races
  # an unloaded model.
  ollama-init:
    image: ollama/ollama:0.40.6
    command: ["sh", "-c", "ollama pull snowflake-arctic-embed2"]
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure
    mem_limit: 2g
    cpus: 1.0

volumes:
  pg_data:
  chroma_data:
  ollama_data:
